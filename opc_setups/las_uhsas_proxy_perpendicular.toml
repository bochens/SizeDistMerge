schema_version = 1
name = "LAS 3340 UHSAS-opening hypothesis perpendicular"
reference = "TSI manual and Moore et al. (2021); aperture angles borrowed from UHSAS"
notes = "Experimental hypothesis only: LAS aperture angles and polarization are not verified. Not a measured LAS calibration."
wavelength_nm = 633.0
angular_step_deg = 0.25
aerosol_direction = [-1.0, 0.0, 0.0]
response_channel = "Collection 1"

[[beams]]
direction = [0, 0, 1]
polarization = [1, 0, 0]
irradiance_fraction = 0.5

[[beams]]
direction = [0, 0, -1]
polarization = [1, 0, 0]
irradiance_fraction = 0.5

[[channels]]
name = "Collection 1"
[[channels.collect]]
axis = [0, 1, 0]
half_angle_deg = 57.0
[[channels.exclude]]
axis = [0, 1, 0]
half_angle_deg = 14.8

[[channels]]
name = "Collection 2"
[[channels.collect]]
axis = [0, -1, 0]
half_angle_deg = 57.0
[[channels.exclude]]
axis = [0, -1, 0]
half_angle_deg = 14.8
