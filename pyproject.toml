[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sizedistmerge"
version = "0.1.0"
description = "Tools for merging aerosol size distributions across instruments."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Bo Chen" },
]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "netCDF4",
  "miepython",
  "zarr",
  "joblib",
]

[project.optional-dependencies]
numba = ["numba"]

[tool.setuptools]
include-package-data = true
packages = ["sizedistmerge", "sizedistmerge.lut"]

[tool.setuptools.package-dir]
"sizedistmerge" = "src"
"sizedistmerge.lut" = "lut"

[tool.setuptools.package-data]
"sizedistmerge.lut" = ["*.zarr/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
